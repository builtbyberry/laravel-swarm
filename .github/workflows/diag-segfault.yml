name: diag-segfault

# TEMPORARY diagnostic workflow. Reproduces the P8 coverage-lane exit-139
# segfault on the Linux runner to (1) confirm whether an unlimited C stack
# clears it (legit-deep-recursion + pcov overhead vs unbounded-recursion bug)
# and (2) capture the USERLAND php backtrace (function + file:line) via debug
# symbols + php's zbacktrace. Runs only on diag/** branches; delete when done.
on:
  push:
    branches:
      - 'diag/**'

permissions:
  contents: read

jobs:
  backtrace:
    name: capture segfault backtrace (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: pcov
          ini-values: memory_limit=1G

      - name: Install dependencies (stable-latest)
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Prepare testbench vendor symlink
        run: |
          if [ ! -e "vendor/orchestra/testbench-core/laravel/vendor" ]; then
            ln -sf '../../../' vendor/orchestra/testbench-core/laravel/vendor
          fi

      - name: Install gdb + php debug symbols
        run: sudo apt-get update && sudo apt-get install -y gdb php8.4-dbg || sudo apt-get install -y gdb

      - name: Show default stack limit
        run: ulimit -a | grep -i stack || true

      - name: PROBE A — unlimited stack under pcov (does the crash vanish?)
        run: |
          set +e
          bash -c 'ulimit -s unlimited 2>/dev/null || ulimit -s 131072; ulimit -s; \
            php -d pcov.enabled=1 -d memory_limit=1G \
              vendor/bin/pest tests/Feature tests/Unit tests/Installer --coverage --min=0'
          echo "PROBE_A_EXIT=$?"

      - name: PROBE B — userland backtrace under gdb (default 8MB stack)
        run: |
          set +e
          curl -fsSL https://raw.githubusercontent.com/php/php-src/PHP-8.4/.gdbinit -o /tmp/php.gdbinit || echo "gdbinit fetch failed"
          gdb -batch \
            -x /tmp/php.gdbinit \
            -ex 'set pagination off' \
            -ex 'set backtrace limit 2000' \
            -ex 'run' \
            -ex 'echo \n===== ZBACKTRACE (userland) =====\n' \
            -ex 'zbacktrace' \
            -ex 'echo \n===== C BACKTRACE (top 60) =====\n' \
            -ex 'bt 60' \
            --args php -d pcov.enabled=1 -d memory_limit=1G \
              vendor/bin/pest tests/Feature tests/Unit tests/Installer --coverage --min=0
          echo "gdb wrapper exit: $?"
