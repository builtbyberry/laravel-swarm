name: diag-segfault

# TEMPORARY diagnostic. Run 5: does the full suite complete under the XDEBUG
# coverage driver (instead of pcov)? pcov segfaults flakily on x86_64 across the
# streaming pipeline; if xdebug does not, swapping the driver is a robust fix.
# Runs only on diag/** branches; delete when done.
on:
  push:
    branches:
      - 'diag/**'

permissions:
  contents: read

jobs:
  xdebug-coverage:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: xdebug
          ini-values: memory_limit=1G
      - name: Install dependencies (stable-latest)
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Prepare testbench vendor symlink
        run: |
          if [ ! -e "vendor/orchestra/testbench-core/laravel/vendor" ]; then
            ln -sf '../../../' vendor/orchestra/testbench-core/laravel/vendor
          fi
      - name: Coverage driver in use
        run: php -v
      - name: Full coverage suite under xdebug (expect pass, no 139)
        run: |
          set +e
          composer test:coverage:ci 2>&1 | tail -25
          echo "XDEBUG_COV_EXIT=${PIPESTATUS[0]}"
