name: diag-segfault

# TEMPORARY diagnostic workflow for the P8 coverage-lane exit-139 segfault.
# Run 3: (F) does an EXPLICIT 1GB C stack clear the real crash? (kernel honors
# an explicit value, unlike "unlimited"); (G) does the isolated crashing test
# file crash on its own under pcov, or is the crash cumulative? Runs only on
# diag/** branches; delete when done.
on:
  push:
    branches:
      - 'diag/**'

permissions:
  contents: read

jobs:
  probe:
    name: stack-size + isolation probes (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: pcov
          ini-values: memory_limit=1G

      - name: Install dependencies (stable-latest)
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Prepare testbench vendor symlink
        run: |
          if [ ! -e "vendor/orchestra/testbench-core/laravel/vendor" ]; then
            ln -sf '../../../' vendor/orchestra/testbench-core/laravel/vendor
          fi

      - name: PROBE F — full suite under pcov with EXPLICIT 1GB stack
        run: |
          set +e
          bash -c 'ulimit -s 1048576; echo "stack_kb=$(ulimit -s)"; \
            php -d pcov.enabled=1 -d memory_limit=1G \
              vendor/bin/pest tests/Feature tests/Unit tests/Installer --coverage --min=0 \
              2>&1 | tail -25'
          echo "PROBE_F_EXIT=${PIPESTATUS[0]:-$?}"

      - name: PROBE G — isolated crashing file under pcov (default stack)
        run: |
          set +e
          php -d pcov.enabled=1 -d memory_limit=1G \
            vendor/bin/pest tests/Feature/ProviderTools/ProviderToolPreservationTest --coverage --min=0 \
            2>&1 | tail -25
          echo "PROBE_G_EXIT=${PIPESTATUS[0]:-$?}"

      - name: PROBE H — isolated crashing file under pcov (EXPLICIT 1GB stack)
        run: |
          set +e
          bash -c 'ulimit -s 1048576; \
            php -d pcov.enabled=1 -d memory_limit=1G \
              vendor/bin/pest tests/Feature/ProviderTools/ProviderToolPreservationTest --coverage --min=0 \
              2>&1 | tail -15'
          echo "PROBE_H_EXIT=$?"
