name: diag-segfault

# TEMPORARY diagnostic. Run 7: localize P8's stack/instrumentation contribution
# by pcov.exclude'ing subsets of P8 files and seeing which exclusion clears the
# reliably-reproducing 8MB crash. Control (no exclude) should crash 139.
# Runs only on diag/** branches; delete when done.
on:
  push:
    branches:
      - 'diag/**'

permissions:
  contents: read

jobs:
  localize:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: pcov
          ini-values: memory_limit=1G
      - name: Install dependencies (stable-latest)
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Prepare testbench vendor symlink
        run: |
          if [ ! -e "vendor/orchestra/testbench-core/laravel/vendor" ]; then
            ln -sf '../../../' vendor/orchestra/testbench-core/laravel/vendor
          fi

      - name: CONTROL — no exclude (expect 139)
        run: |
          set +e
          php -d pcov.enabled=1 -d memory_limit=1G \
            vendor/bin/pest tests/Feature tests/Unit tests/Installer --coverage --min=0 2>&1 | tail -3
          echo "CONTROL_EXIT=${PIPESTATUS[0]}"

      - name: PROBE A — exclude NEW adapter/protocol files
        run: |
          set +e
          php -d pcov.enabled=1 -d memory_limit=1G \
            -d "pcov.exclude=~(Streaming/NativeChatProtocolAdapter|Streaming/Protocols/|Streaming/PayloadAvailability|Enums/NativeProtocolProjection|Events/NativeProtocolProjectionFailed|Streaming/Exceptions/NativeProtocolProjectionException)~" \
            vendor/bin/pest tests/Feature tests/Unit tests/Installer --coverage --min=0 2>&1 | tail -3
          echo "PROBE_A_EXIT=${PIPESTATUS[0]}"

      - name: PROBE B — exclude MODIFIED streaming hot-path files
        run: |
          set +e
          php -d pcov.enabled=1 -d memory_limit=1G \
            -d "pcov.exclude=~(Responses/StreamableSwarmResponse|Streaming/StreamEventMapper|Runners/[A-Za-z]*StreamRunner|Support/SwarmHistory)~" \
            vendor/bin/pest tests/Feature tests/Unit tests/Installer --coverage --min=0 2>&1 | tail -3
          echo "PROBE_B_EXIT=${PIPESTATUS[0]}"
