name: mutation

# Mutation testing runs on a daily schedule rather than per PR. With ~24k LOC
# of source, even `--covered-only` generates thousands of mutations, and each
# survives or dies by running the affected tests — wall time is hours, not
# minutes. Keeping this off the PR path avoids gating merges on a long-running
# baseline job. Use `workflow_dispatch` for an on-demand run.
on:
  schedule:
    # 07:17 UTC daily — off-the-hour to avoid GitHub's cron stampede.
    - cron: '17 7 * * *'
  workflow_dispatch:

jobs:
  mutate:
    name: PHP 8.5 - Pest Mutate (baseline)
    runs-on: ubuntu-24.04
    # Non-blocking informational job — failure surfaces in the schedule run
    # but does not gate any other workflow. A gating threshold via --min
    # will land in a follow-up once baseline scores stabilise (see issue #12).
    continue-on-error: true
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: pcov
          ini-values: memory_limit=1G

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      # testbench-core no longer auto-creates this symlink in some versions; the
      # process-concurrency tests spawn a real artisan subprocess that needs it.
      - name: Prepare testbench vendor symlink
        run: |
          if [ ! -e "vendor/orchestra/testbench-core/laravel/vendor" ]; then
            ln -sf '../../../' vendor/orchestra/testbench-core/laravel/vendor
          fi

      - name: Run Pest mutation testing
        run: composer test:mutation
