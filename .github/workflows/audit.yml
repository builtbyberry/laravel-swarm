name: audit

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: composer audit (${{ matrix.resolution.name }})
    runs-on: ubuntu-24.04
    # Deliberate deferral owned by the maintainer: this job remains non-blocking,
    # so a green workflow check does not prove the resolved tree is advisory-clean.
    # The maintainer reads both matrix job outputs by hand before every tag.
    # Revisit whether to remove `continue-on-error` during the v0.29 release.
    # This package commits no composer.lock, so the audit runs against freshly
    # resolved prefer-stable and prefer-lowest trees; an advisory may affect only
    # one resolution, and the matrix job name identifies which one.
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        resolution:
          - name: prefer-stable
            flags: '--prefer-stable'
          - name: prefer-lowest
            flags: '--prefer-lowest --prefer-stable'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Resolve dependencies (${{ matrix.resolution.name }})
        run: composer update ${{ matrix.resolution.flags }} --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies for known advisories
        run: composer audit
