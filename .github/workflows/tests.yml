name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Laravel 13 (${{ matrix.dependencies }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
        dependencies:
          - stable-latest
          - lowest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: pcov
          ini-values: memory_limit=1G

      - name: Install dependencies
        if: matrix.dependencies == 'stable-latest'
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --with laravel/ai:0.11.2 --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Verify official dependency provenance
        run: php .github/workflows/verify-adoption-dependencies.php ${{ matrix.dependencies == 'lowest' && 'minimum' || 'current' }}

      # testbench-core no longer auto-creates this symlink in some versions; the
      # process-concurrency tests spawn a real artisan subprocess that needs it.
      - name: Prepare testbench vendor symlink
        run: |
          if [ ! -e "vendor/orchestra/testbench-core/laravel/vendor" ]; then
            ln -sf '../../../' vendor/orchestra/testbench-core/laravel/vendor
          fi

      # Same quality gates on stable-latest and lowest (see CONTRIBUTING.md if nightly split is needed).
      # The CI script enforces a line-coverage floor; raise it deliberately as the suite grows.
      - name: Execute tests with coverage
        run: composer test:coverage:ci

      - name: Execute process concurrency validation
        run: composer test:process-concurrency:ci

      - name: Execute static analysis
        run: composer analyse

      # Named compliance gate: re-runs the scope-isolation / propagation and
      # replay-determinism suites (the `compliance` Pest group) as the release
      # compliance evidence. They also run inside test:coverage:ci above; this
      # step exists so the gate is a discrete, re-runnable lane. stable-latest
      # only, to avoid duplicating the work on the lowest matrix.
      - name: Execute compliance gate
        if: matrix.dependencies == 'stable-latest'
        run: composer test:compliance

      # Pint's ruleset on the --prefer-lowest matrix is pinned to an older
      # version that disagrees with the current code style, so style is only
      # gated on stable-latest.
      - name: Execute code style check
        if: matrix.dependencies == 'stable-latest'
        run: composer lint

  laravel-13-16:
    name: PHP ${{ matrix.php }} - Laravel 13.16 compatibility (Pest 4)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      # Pest 5's Laravel plugin cannot resolve Laravel 13.16. Keep this
      # compatibility toolchain local to the job; consumer requirements stay intact.
      - name: Preserve production manifest
        run: cp composer.json /tmp/swarm-production-composer.json

      - name: Select compatibility test toolchain
        run: composer require --no-update --dev "pestphp/pest:^4.7" "pestphp/pest-plugin-laravel:^4.1" "laravel/framework:13.16.0"

      - name: Install compatibility dependencies
        run: composer update --with laravel/ai:0.11.2 --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Restore production manifest for package contract tests
        run: cp /tmp/swarm-production-composer.json composer.json

      - name: Verify installed compatibility dependencies
        run: php .github/workflows/verify-adoption-dependencies.php laravel-13.16

      - name: Prepare testbench vendor symlink
        run: |
          if [ ! -e "vendor/orchestra/testbench-core/laravel/vendor" ]; then
            ln -sf '../../../' vendor/orchestra/testbench-core/laravel/vendor
          fi

      # Coverage remains mandatory in all four Pest 5 jobs above. Avoid Pest 4's
      # coverage-report reload overhead while exercising the full older runtime.
      - name: Execute compatibility tests
        run: composer test

      - name: Execute process concurrency validation
        run: composer test:process-concurrency:ci

      - name: Execute static analysis
        run: composer analyse
