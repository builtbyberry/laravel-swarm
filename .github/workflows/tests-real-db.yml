name: tests (real DB)

# Enforces the `skip-locked-real-db` group from `composer test:process-concurrency:real-db`
# and the native conversation upgrade fixtures against actual MySQL and Postgres service containers. The default `tests` workflow runs
# the process-concurrency suite against in-memory SQLite, which honors neither cross-process
# state nor `FOR UPDATE SKIP LOCKED` — so the audit outbox concurrency contract can only
# be enforced here.
#
# Two jobs instead of a single `services:` matrix because GitHub Actions does not let you
# disable a service per matrix leg: every service block in a job is started for every leg.
# Splitting keeps each leg's container set minimal and the failure surface clear.
#
# If you add another `skip-locked-real-db` test, no workflow change is required; this lane
# already runs the whole group via the `--group=skip-locked-real-db` composer script.

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

# Scope the GITHUB_TOKEN to least privilege. Both jobs only checkout the repo
# and run tests against ephemeral service containers — no PR comments, no
# release writes, no artifact uploads — so contents:read is sufficient.
# Matches the pattern set by .github/workflows/branch-naming.yml.
permissions:
  contents: read

jobs:
  tests-real-db-mysql:
    name: PHP 8.4 - real DB (mysql-8, ${{ matrix.dependencies }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dependencies: [stable, moving-dev]

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_swarm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: laravel_swarm_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo, pdo_mysql, pdo_sqlite
          coverage: none
          ini-values: memory_limit=512M

      - name: Preserve production manifest
        run: cp composer.json /tmp/swarm-production-composer.json

      - name: Capture official moving branch references
        if: matrix.dependencies == 'moving-dev'
        shell: bash
        run: |
          set -euo pipefail
          capture_ref() {
            local url="$1" branch="$2" variable="$3" ref name
            local evidence="$RUNNER_TEMP/$variable.refs"
            git ls-remote --exit-code "$url" "$branch" > "$evidence"
            test "$(wc -l < "$evidence")" -eq 1
            read -r ref name < "$evidence"
            if [[ "$name" != "$branch" || ! "$ref" =~ ^[a-f0-9]{40}$ ]]; then
              echo "Invalid official branch reference for $url $branch" >&2
              return 1
            fi
            printf '%s=%s\n' "$variable" "$ref" >> "$GITHUB_ENV"
            printf '%s %s %s\n' "$url" "$branch" "$ref"
          }
          date -u '+Official branch refs observed at %Y-%m-%dT%H:%M:%SZ'
          capture_ref https://github.com/laravel/ai.git refs/heads/1.x SWARM_AI_DEV_REF
          capture_ref https://github.com/laravel/framework.git refs/heads/13.x SWARM_FRAMEWORK_DEV_REF

      - name: Require compatible moving development dependencies
        if: matrix.dependencies == 'moving-dev'
        run: |
          composer require --no-update "laravel/ai:1.x-dev#${SWARM_AI_DEV_REF}"
          composer require --no-update --dev "laravel/framework:13.x-dev#${SWARM_FRAMEWORK_DEV_REF}"

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Restore production manifest
        run: cp /tmp/swarm-production-composer.json composer.json

      - name: Verify official dependencies
        run: php .github/workflows/verify-adoption-dependencies.php ${{ matrix.dependencies == 'moving-dev' && 'moving-dev' || 'current' }} "$PWD" /tmp/swarm-production-composer.json

      # testbench-core no longer auto-creates this symlink in some versions; the
      # process-concurrency tests spawn a real artisan subprocess that needs it.
      - name: Prepare testbench vendor symlink
        run: |
          if [ ! -e "vendor/orchestra/testbench-core/laravel/vendor" ]; then
            ln -sf '../../../' vendor/orchestra/testbench-core/laravel/vendor
          fi

      # Belt-and-suspenders: the service container health checks should make this
      # unnecessary, but a deterministic probe gives a clearer failure message if
      # the container never becomes ready.
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h "${DB_HOST}" -P "${DB_PORT}" -uroot -p"${DB_PASSWORD}" --silent >/dev/null 2>&1; then
              echo "MySQL is up after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "MySQL did not become ready in time." >&2
          exit 1

      # `--fail-on-skipped` is intentional inside the composer script: if the env
      # vars above don't route the testbench `testing` connection to a real backend,
      # AuditOutboxConcurrencyTest will skip with the "requires a shared database
      # engine" message and this step will fail loudly — exactly what we want,
      # because a silent skip would let the SKIP LOCKED contract regress unnoticed.
      - name: Execute real-DB process concurrency suite
        run: composer test:process-concurrency:real-db

      - name: Verify native upgrade fixture drivers
        run: php -r 'foreach (["sqlite", getenv("DB_CONNECTION")] as $driver) { if (!in_array($driver, PDO::getAvailableDrivers(), true)) { fwrite(STDERR, "Missing PDO driver ".$driver."\n"); exit(1); } }'

      - name: Execute native conversation upgrade suite
        run: composer test:native-conversation-upgrade:real-db

  tests-real-db-postgres:
    name: PHP 8.4 - real DB (postgres-16, ${{ matrix.dependencies }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dependencies: [stable, moving-dev]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: laravel_swarm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: laravel_swarm_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo, pdo_pgsql, pdo_sqlite
          coverage: none
          ini-values: memory_limit=512M

      - name: Preserve production manifest
        run: cp composer.json /tmp/swarm-production-composer.json

      - name: Capture official moving branch references
        if: matrix.dependencies == 'moving-dev'
        shell: bash
        run: |
          set -euo pipefail
          capture_ref() {
            local url="$1" branch="$2" variable="$3" ref name
            local evidence="$RUNNER_TEMP/$variable.refs"
            git ls-remote --exit-code "$url" "$branch" > "$evidence"
            test "$(wc -l < "$evidence")" -eq 1
            read -r ref name < "$evidence"
            if [[ "$name" != "$branch" || ! "$ref" =~ ^[a-f0-9]{40}$ ]]; then
              echo "Invalid official branch reference for $url $branch" >&2
              return 1
            fi
            printf '%s=%s\n' "$variable" "$ref" >> "$GITHUB_ENV"
            printf '%s %s %s\n' "$url" "$branch" "$ref"
          }
          date -u '+Official branch refs observed at %Y-%m-%dT%H:%M:%SZ'
          capture_ref https://github.com/laravel/ai.git refs/heads/1.x SWARM_AI_DEV_REF
          capture_ref https://github.com/laravel/framework.git refs/heads/13.x SWARM_FRAMEWORK_DEV_REF

      - name: Require compatible moving development dependencies
        if: matrix.dependencies == 'moving-dev'
        run: |
          composer require --no-update "laravel/ai:1.x-dev#${SWARM_AI_DEV_REF}"
          composer require --no-update --dev "laravel/framework:13.x-dev#${SWARM_FRAMEWORK_DEV_REF}"

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Restore production manifest
        run: cp /tmp/swarm-production-composer.json composer.json

      - name: Verify official dependencies
        run: php .github/workflows/verify-adoption-dependencies.php ${{ matrix.dependencies == 'moving-dev' && 'moving-dev' || 'current' }} "$PWD" /tmp/swarm-production-composer.json

      # testbench-core no longer auto-creates this symlink in some versions; the
      # process-concurrency tests spawn a real artisan subprocess that needs it.
      - name: Prepare testbench vendor symlink
        run: |
          if [ ! -e "vendor/orchestra/testbench-core/laravel/vendor" ]; then
            ln -sf '../../../' vendor/orchestra/testbench-core/laravel/vendor
          fi

      # Belt-and-suspenders: the service container health checks should make this
      # unnecessary, but a deterministic probe gives a clearer failure message if
      # the container never becomes ready.
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD="${DB_PASSWORD}" pg_isready -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USERNAME}" >/dev/null 2>&1; then
              echo "Postgres is up after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready in time." >&2
          exit 1

      # `--fail-on-skipped` is intentional inside the composer script: if the env
      # vars above don't route the testbench `testing` connection to a real backend,
      # AuditOutboxConcurrencyTest will skip with the "requires a shared database
      # engine" message and this step will fail loudly — exactly what we want,
      # because a silent skip would let the SKIP LOCKED contract regress unnoticed.
      - name: Execute real-DB process concurrency suite
        run: composer test:process-concurrency:real-db

      - name: Verify native upgrade fixture drivers
        run: php -r 'foreach (["sqlite", getenv("DB_CONNECTION")] as $driver) { if (!in_array($driver, PDO::getAvailableDrivers(), true)) { fwrite(STDERR, "Missing PDO driver ".$driver."\n"); exit(1); } }'

      - name: Execute native conversation upgrade suite
        run: composer test:native-conversation-upgrade:real-db
