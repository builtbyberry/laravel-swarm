name: nightly

on:
  schedule:
    # 06:17 UTC daily — off the hour to avoid contention with the GitHub-wide
    # cron stampede at :00. Early signal for breaking changes on the
    # laravel/framework 13.x development branch (the major this package requires).
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP 8.5 - Laravel 13.x-dev / AI 1.x-dev
    runs-on: ubuntu-24.04
    # PR runs prove the candidate before merge. A separate workflow_dispatch on
    # main is still required after its authorized merge and before tagging.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: pcov
          ini-values: memory_limit=1G

      - name: Preserve production manifest
        run: cp composer.json /tmp/swarm-production-composer.json

      - name: Capture official moving branch references
        shell: bash
        run: |
          set -euo pipefail
          capture_ref() {
            local url="$1" branch="$2" variable="$3" ref name
            local evidence="$RUNNER_TEMP/$variable.refs"
            git ls-remote --exit-code "$url" "$branch" > "$evidence"
            test "$(wc -l < "$evidence")" -eq 1
            read -r ref name < "$evidence"
            if [[ "$name" != "$branch" || ! "$ref" =~ ^[a-f0-9]{40}$ ]]; then
              echo "Invalid official branch reference for $url $branch" >&2
              return 1
            fi
            printf '%s=%s\n' "$variable" "$ref" >> "$GITHUB_ENV"
            printf '%s %s %s\n' "$url" "$branch" "$ref"
          }
          date -u '+Official branch refs observed at %Y-%m-%dT%H:%M:%SZ'
          capture_ref https://github.com/laravel/ai.git refs/heads/1.x SWARM_AI_DEV_REF
          capture_ref https://github.com/laravel/framework.git refs/heads/13.x SWARM_FRAMEWORK_DEV_REF

      - name: Require compatible official development branches
        run: |
          composer require --no-update "laravel/ai:1.x-dev#${SWARM_AI_DEV_REF}"
          composer require --no-update --dev "laravel/framework:13.x-dev#${SWARM_FRAMEWORK_DEV_REF}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Restore production manifest for package contract tests
        run: cp /tmp/swarm-production-composer.json composer.json

      - name: Verify actual moving development dependencies
        run: php .github/workflows/verify-adoption-dependencies.php moving-dev "$PWD" /tmp/swarm-production-composer.json

      # testbench-core no longer auto-creates this symlink in some versions; the
      # process-concurrency tests spawn a real artisan subprocess that needs it.
      - name: Prepare testbench vendor symlink
        run: |
          if [ ! -e "vendor/orchestra/testbench-core/laravel/vendor" ]; then
            ln -sf '../../../' vendor/orchestra/testbench-core/laravel/vendor
          fi

      - name: Execute tests
        run: composer test

      - name: Execute process concurrency validation
        run: composer test:process-concurrency:ci

      - name: Execute static analysis
        run: composer analyse

      - name: Execute compliance gate
        run: composer test:compliance

      - name: Execute code style check
        run: composer lint
